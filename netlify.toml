# Netlify 部署設定。這是本站唯一的部署目標（GitHub Pages 已停用）。

[build]
command = "npm run build"
publish = "dist"

# SPA rewrite。路由改用 BrowserRouter 之後，/detail/fosanthos 這類網址
# 會真的送到伺服器，而 dist 裡並沒有這個檔案 —— 少了這條規則，
# 直接開連結或重新整理都會拿到 404。
#
# 放在既有的靜態檔案之後才生效，所以 /sitemap.xml、/og-image.jpg、
# /assets/* 仍照常回傳自己，不會被這條吃掉。
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
# 明確釘住 Node 版本。本專案仍在 Vite 4，跟著 Netlify 預設版本一路往上跳
# 遲早會出現相依性錯誤或建置失敗 —— 釘住之後升級時機由自己決定。
NODE_VERSION = "20"

# Vite 產出的檔名都帶內容 hash，內容一變檔名就變，
# 因此可以放心地長期快取。Netlify 預設對所有檔案都是 must-revalidate，
# 每次瀏覽都要重新驗證 —— 對 6MB 的背景影片來說是實質的頻寬浪費。
[[headers]]
for = "/assets/*"

[headers.values]
cache-control = "public, max-age=31536000, immutable"

# index.html 相反：絕對不能快取，否則使用者會一直拿到舊版的
# 資源引用清單，指向已經被替換掉的 hash 檔名。
[[headers]]
for = "/index.html"

[headers.values]
cache-control = "public, max-age=0, must-revalidate"
